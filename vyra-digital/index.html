<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VYRA Digital | فايرا ديجيتال</title>
<meta name="description" content="VYRA Digital — Digital Creative Studio. نحوّل الأفكار إلى تجارب رقمية.">
<meta property="og:title" content="VYRA Digital">
<meta property="og:description" content="We turn ideas into digital experiences.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;500;700;800&family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="cur" aria-hidden="true"></div>

<header><div class="w">
  <a class="logo" href="#top" aria-label="VYRA Digital"><span id="lg"></span><span data-b="name"></span></a>
  <nav id="nav"></nav>
  <button class="btn sm" id="lang" aria-label="Language"></button>
  <a class="btn p sm hide" data-i="cta1" href="#contact"></a>
</div></header>

<main id="top">
  <section class="hero">
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="w">
      <div>
        <h1 data-i="h1"></h1>
        <p class="lead" data-i="lead"></p>
        <div class="row">
          <a class="btn p mag" data-i="cta1" href="#contact"></a>
          <a class="btn mag" data-i="cta2" href="#works"></a>
        </div>
      </div>
      <div class="stage" aria-hidden="true"><div class="stack" id="stack"></div></div>
    </div>
  </section>

  <section id="services"><div class="w">
    <h2 class="rv" data-i="sh"></h2><p class="sub rv" data-i="ss"></p>
    <div class="grid" id="svc"></div>
  </div></section>

  <section id="process"><div class="w">
    <h2 class="rv" data-i="ph"></h2><p class="sub rv" data-i="ps"></p>
    <div class="steps" id="steps"></div>
  </div></section>

  <section id="works"><div class="w">
    <h2 class="rv" data-i="wh"></h2><p class="sub rv" data-i="ws"></p>
    <div class="works" id="wk"></div>
  </div></section>

  <section id="about"><div class="w about">
    <div>
      <h2 class="rv" data-i="ah"></h2><p class="sub rv" data-i="ap"></p>
      <h3 style="margin-top:2rem;font-weight:600" id="fn"></h3>
      <p class="sub" style="margin-top:.2rem" id="fr"></p>
      <p class="sub" id="fb"></p>
      <div class="links" id="fl"></div>
    </div>
    <div class="photo" id="ph"></div>
  </div></section>

  <section id="contact"><div class="w"><div class="cta">
    <h2 data-i="ch"></h2><p class="sub" data-i="cs"></p>
    <div class="row" style="margin-top:2rem" id="cl"></div>
  </div></div></section>
</main>

<footer><div class="w"><span id="ft"></span><span data-i="tg"></span></div></footer>

<script src="js/config/brand.js"></script>
<script src="js/config/founder.js"></script>
<script src="js/config/contact.js"></script>
<script src="js/config/services.js"></script>
<script src="js/config/projects.js"></script>
<script src="js/config/process.js"></script>
<script src="js/i18n/ar.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/motion.js"></script>
<script src="js/main.js"></script>
</body>
</html>
